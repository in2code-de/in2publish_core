<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{testStatus}">
    <div class="alert alert-warning" role="alert" data-publisher-test-warning>
        <h3><f:translate key="test_state_error" extensionName="In2publishCore" /></h3>
        <ul>
            <f:for each="{testStatus}" as="status">
                <li><f:translate key="test_state_error.{status}" extensionName="In2publishCore" /></li>
            </f:for>
        </ul>
        <f:if condition="{fileUidWarning}">
            <h4>{fileUidWarning.translatedLabel}</h4>
            <p><f:format.nl2br>{fileUidWarning.translatedMessages}</f:format.nl2br></p>
        </f:if>
        <p><f:translate key="test_warning.review" extensionName="In2publishCore" /></p>
        <f:form action="acceptTestWarning" method="post">
            <f:form.hidden name="identifier" value="{testWarningIdentifier}" />
            <f:form.submit class="btn btn-warning" value="{f:translate(key: 'test_warning.accept', extensionName: 'In2publishCore')}" />
        </f:form>
    </div>
</f:if>
</html>
