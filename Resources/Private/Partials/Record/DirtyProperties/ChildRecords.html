<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:publish="http://typo3.org/ns/In2code/In2publishCore/ViewHelpers"
	  xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
	  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
	  data-namespace-typo3-fluid="true"
>
<f:comment>
	Show children records with dirty properties
</f:comment>
<f:for each="{publish:record.getChangedDescendants(record: record, maxDepth: 8)}" key="tableName" as="relatedRecords">
	<f:if condition="{publish:Miscellaneous.HasChangedRecords(records:relatedRecords)}">
		<table class="table table-striped">
			<thead>
			<tr>
				<th>
					<f:if condition="{stagingLevel} == 'local'">
						<f:then>
							<publish:Tca.GetTableLabelFromLocallang tableName="{tableName}"/>
						</f:then>
						<f:else>
									<span class="invisible">
										<publish:Tca.GetTableLabelFromLocallang tableName="{tableName}"/>
									</span>
						</f:else>
					</f:if>
				</th>
			</tr>
			</thead>
			<tbody>
			<f:for each="{relatedRecords}" as="relatedRecord">
				<f:if condition="{relatedRecord.changed}">
					<tr data-record-row="{relatedRecord.classification}-{relatedRecord.id}">
						<td>
							<f:if condition="{stagingLevel} == 'local'">
								<f:then>
									<publish:Link.RecordHistory class="btn btn-default btn-sm" title="{f:translate(key:'dirty_properties_undo',default:'undo')}" uid="{relatedRecord.id}" table="{relatedRecord.classification}">
										<core:icon identifier="actions-history"></core:icon>
									</publish:Link.RecordHistory>
									<f:if condition="{relatedRecord.id} > 1">
										<f:then>
											<be:link.editRecord class="btn btn-default btn-sm" uid="{relatedRecord.id}" table="{relatedRecord.classification}">
												<core:icon identifier="actions-pencil"></core:icon>
											</be:link.editRecord>
										</f:then>
										<f:else>
											<button class="btn btn-default btn-sm pe-none invisible">
												<core:icon identifier="actions-pencil"></core:icon>
											</button>
										</f:else>
									</f:if>
									<f:if condition="{relatedRecord.state} == 'changed'">
										<button type="button" class="btn btn-default btn-sm"
												data-action="togglechangedproperties"
												data-record-changes="{relatedRecord.classification}-{relatedRecord.id}"
												aria-expanded="false">
											<core:icon identifier="actions-info"></core:icon>
										</button>
									</f:if>
								</f:then>
								<f:else>
									<f:comment>Empty button for non-local stages to match row height</f:comment>
									<button type="button" class="btn btn-default btn-sm invisible float-end">
										<core:icon identifier="actions-info"></core:icon>
									</button>
								</f:else>
							</f:if>
							<f:if condition="{stagingLevel} == 'local'">
								<f:then>
									<core:iconForRecord row="{relatedRecord.localProps}" table="{tableName}"></core:iconForRecord>
								</f:then>
								<f:else>
									<core:iconForRecord row="{relatedRecord.foreignProps}" table="{tableName}"></core:iconForRecord>
								</f:else>
							</f:if>
							<publish:Tca.GetLabelFieldFromRecord record="{relatedRecord}" stagingLevel="{stagingLevel}"/>
							<f:if condition="{relatedRecord.state} == 'changed'">
								<div class="d-none mt-1" data-record-changes-content="{relatedRecord.classification}-{relatedRecord.id}">
									<ul class="list-unstyled mb-0">
										<f:for each="{relatedRecord.changedProps}" as="fieldName">
											<li data-record-identifier="{relatedRecord.classification}-{relatedRecord.id}" data-field-name="{fieldName}">
												<strong><publish:Tca.GetFieldLabelFromLocallang fieldName="{fieldName}" tableName="{relatedRecord.classification}"/>:</strong>
												<publish:Tca.FormatPropertyByTcaDefinition fieldName="{fieldName}" tableName="{relatedRecord.classification}">
													<publish:Miscellaneous.GetPropertyFromStagingDefinition record="{relatedRecord}" propertyName="{fieldName}" stagingLevel="{stagingLevel}"/>
												</publish:Tca.FormatPropertyByTcaDefinition>
											</li>
										</f:for>
									</ul>
								</div>
							</f:if>
						</td>
					</tr>
				</f:if>
			</f:for>
			</tbody>
		</table>
	</f:if>
</f:for>
</html>
